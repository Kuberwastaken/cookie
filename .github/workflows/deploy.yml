name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub's deployment-status endpoint currently sticks on
        # "deployment_in_progress" long after the content has actually gone
        # live, so the step times out and reports failure for a deploy that
        # succeeded. 600000ms is a hard maximum (larger values are silently
        # clamped), so we can't wait it out; instead don't fail the run on it.
        # Check the live site, not this step, to confirm a deploy landed.
        continue-on-error: true
        with:
          timeout: 600000
